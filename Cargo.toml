[workspace]
resolver = "2"
members = ["crates/litgraph", "crates/litgraph-cli", "crates/litgraph-mcp", "crates/litgraph-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["David Awad"]
repository = "https://github.com/davidawad/litgraph"
homepage = "https://github.com/davidawad/litgraph"
readme = "README.md"
keywords = ["litigation", "law", "graph", "mdp", "simulation"]
categories = ["command-line-utilities", "science", "simulation"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric code: counts become probabilities, ids become array indices, and
# short names (p, q, v, e, n) are the domain's own notation.
cast_precision_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
# Exact float comparisons here are intentional sentinel checks (0.0, 1.0).
float_cmp = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
