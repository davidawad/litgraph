[workspace]
resolver = "2"
members = ["crates/litgraph", "crates/litgraph-cli", "crates/litgraph-mcp", "crates/litgraph-wasm", "crates/litgraph-schema-bundle", "crates/litgraph-packs", "crates/litigate-base", "crates/litigate-syntax", "crates/litigate-sema", "crates/litigate-lower", "crates/litigate-verify", "crates/litigate-import", "crates/litigate-cli", "crates/litigate-lsp", "crates/litigate-smt", "editors/tree-sitter-litigate", "editors/litigate-editors"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["David Awad"]
repository = "https://github.com/davidawad/litgraph"
homepage = "https://github.com/davidawad/litgraph"
readme = "README.md"
keywords = ["litigation", "law", "graph", "mdp", "simulation"]
categories = ["command-line-utilities", "science", "simulation"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
schemars = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rand = "0.9"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
logos = "0.15"
rowan = "0.16"
salsa = "0.28.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp = "0.20"
insta = "1"
ariadne = "0.5"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
cc = "1"
toml = { version = "0.9", features = ["preserve_order"] }
sha2 = "0.10"
assert_cmd = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric code: counts become probabilities, ids become array indices, and
# short names (p, q, v, e, n) are the domain's own notation.
cast_precision_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
# Exact float comparisons here are intentional sentinel checks (0.0, 1.0).
float_cmp = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
