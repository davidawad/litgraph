# typos (https://github.com/crate-ci/typos) spell-checker config.
# Run locally: `typos`. Wired into CI's `actions-self-lint`-adjacent lane
# is not needed -- typos ships its own GitHub Action (see ci.yml `typos`).

[default]
extend-ignore-re = [
    # Legal citations and docket-style tokens sometimes read as typos.
]

[files]
extend-exclude = [
    "packs/*.json",   # legal-procedure JSON packs -- case names, citations
    "Cargo.lock",
    "flake.lock",
    "devenv.lock",
    "target/",
    "dist/",
]
