# typos (https://github.com/crate-ci/typos) spell-checker config.
# Run locally: `typos`. CI runs it via the `typos` job in ci.yml.

[default]
extend-ignore-re = [
    # Legal citations and docket-style tokens sometimes read as typos.
]

[default.extend-words]
# Legal terms: sur-reply, Federal Rules of Evidence.
sur = "sur"
Sur = "Sur"
FRE = "FRE"
# Temporary restraining order; Chief Judge Howard T. Markey (tests/cases/).
TRO = "TRO"
Markey = "Markey"

[default.extend-identifiers]
# Short graph-algorithm locals (node a/b, node n/d).
ba = "ba"
nd = "nd"
# Short keys in marketing/graph/index.html (terminal "tje", label position "tpos").
tje = "tje"
tpos = "tpos"

[files]
extend-exclude = [
    "packs/*.json",  # legal-procedure JSON packs -- case names, citations
    "tests/fixtures/",  # verbatim copies of upstream packs
    "marketing/*/index.html",  # animation scripts with short locals (tje, tpos)
    "sources/*.txt",  # vendored L0 primary-law text (see sources/PROVENANCE.md); PDF/HTML
                       # extraction preserves the original's line-wrap hyphenation verbatim
                       # ("Represen-\ntation"), which reads as typos but isn't ours to fix
    "Cargo.lock",
    "flake.lock",
    "devenv.lock",
    "target/",
    "dist/",
]
